# Render Blueprint: 저장소를 연결하면 main 푸시마다 변경된 서비스만 자동 배포된다 (Deploy Hook 불필요)
services:
  # Backend API - https://cognipick-api.onrender.com
  - type: web
    name: cognipick-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    buildFilter:
      paths:
        - backend/**
        - requirements.txt
        - Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@cognipick.dev
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGINS
        value: https://cognipick.netlify.app,https://cognipick.onrender.com
      - key: FRONTEND_URL
        value: https://cognipick.onrender.com
      - key: BACKEND_PUBLIC_URL
        value: https://cognipick-api.onrender.com
      - key: ENABLE_TEST_LOGIN
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false

  # Frontend Production - https://cognipick.onrender.com
  - type: web
    name: cognipick
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    branch: main
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cognipick-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
